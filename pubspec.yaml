name: medlens_mobile
description: "MedLens AI - Real-time visual first aid companion"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  go_router: ^14.8.0
  camera: ^0.11.0+2
  flutter_sound: ^9.16.3
  permission_handler: ^11.3.1
  web_socket_channel: ^3.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  share_plus: ^10.1.4
  intl: ^0.19.0
  uuid: ^4.5.1
  path_provider: ^2.1.5
  typed_data: ^1.4.0
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
